name: Post preview link

# When Cloudflare Pages finishes a preview deploy, comment the exact post URL
# (preview base + /blog/<slug>/) on the pull request. Free: runs on GitHub's
# built-in token, no secrets.
on:
  deployment_status: {}

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    # Only successful PREVIEW deploys (previews live on *.pages.dev; production is the real domain).
    if: >
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, '.pages.dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = context.payload.deployment_status.environment_url;
            const sha = context.payload.deployment.sha;
            if (!url || !sha) return;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const pr = prs.data.find((p) => p.state === 'open');
            if (!pr) return;

            const match = (pr.body || '').match(/<!--\s*post-slug:\s*([a-z0-9-]+)\s*-->/);
            const link = match ? `${url}/blog/${match[1]}/` : url;

            const marker = '<!-- preview-link-bot -->';
            const body = `${marker}\n📄 **Preview your post:** ${link}\n\n_Updates on each redeploy._`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.data.find((c) => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
